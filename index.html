<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FocusList - Task Management Application with priority, filtering, and statistics">
    <title>FocusList - Task Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #faf5ff 100%);
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .task-checkbox:checked + div {
            text-decoration: line-through;
            color: #9ca3af;
        }
        
        .priority-high { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .priority-medium { background-color: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
        .priority-low { background-color: #dbeafe; color: #2563eb; border: 1px solid #bfdbfe; }
        
        .view-list .task-grid { display: block; }
        .view-kanban .task-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 1rem;
        }
        
        .kanban-column {
            background: rgba(248, 250, 252, 0.8);
            border-radius: 0.75rem;
            padding: 1rem;
            min-height: 200px;
        }
        
        [contenteditable]:focus {
            outline: 2px solid #3b82f6;
            border-radius: 0.25rem;
            padding: 0.25rem;
        }
        
        .btn-primary {
            background-color: #1e293b;
            color: white;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background-color: #334155;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2);
        }
        
        .filter-active {
            background-color: #1e293b;
            color: white;
        }
        
        @media (max-width: 640px) {
            .stats-grid { grid-template-columns: 1fr; }
            .filter-bar { flex-direction: column; gap: 0.75rem; }
        }
    </style>
</head>
<body class="gradient-bg">
    <main class="container mx-auto px-4 py-8 max-w-5xl" role="main">
        <!-- Header Section -->
        <header class="mb-8 text-center">
            <p class="text-xs font-semibold tracking-widest text-slate-500 uppercase mb-2">Personal Workspace</p>
            <h1 class="text-4xl font-bold text-slate-800 mb-2">FocusList</h1>
            <p class="text-slate-600">Quiet intentions, ordered by what matters today.</p>
        </header>

        <!-- Task Statistics Dashboard -->
        <section class="glass-card rounded-2xl shadow-lg p-6 mb-6" aria-label="Task Statistics">
            <div class="stats-grid grid grid-cols-3 gap-4">
                <article class="text-center p-4 bg-white rounded-xl shadow-sm" data-stat="total-tasks">
                    <p class="text-sm text-slate-500 font-medium uppercase tracking-wide">Total Tasks</p>
                    <p class="text-3xl font-bold text-slate-800" id="stat-total">0</p>
                </article>
                <article class="text-center p-4 bg-white rounded-xl shadow-sm" data-stat="pending-tasks">
                    <p class="text-sm text-slate-500 font-medium uppercase tracking-wide">Pending Tasks</p>
                    <p class="text-3xl font-bold text-amber-600" id="stat-pending">0</p>
                </article>
                <article class="text-center p-4 bg-white rounded-xl shadow-sm" data-stat="completed-tasks">
                    <p class="text-sm text-slate-500 font-medium uppercase tracking-wide">Completed Tasks</p>
                    <p class="text-3xl font-bold text-emerald-600" id="stat-completed">0</p>
                </article>
            </div>
        </section>

        <!-- Task Creation Section -->
        <section class="glass-card rounded-2xl shadow-lg p-6 mb-6" aria-label="Task Creation">
            <h2 class="text-lg font-semibold text-slate-800 mb-4">Add New Task</h2>
            <form id="task-form" class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1">
                    <label for="task-title" class="sr-only">Task Title</label>
                    <input 
                        type="text" 
                        id="task-title" 
                        name="task-title"
                        placeholder="Enter task title" 
                        required
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white/80"
                        aria-label="Enter task title"
                    >
                </div>
                <div class="sm:w-40">
                    <label for="task-priority" class="sr-only">Task Priority</label>
                    <select 
                        id="task-priority" 
                        name="task-priority"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white/80"
                        aria-label="Select task priority"
                    >
                        <option value="High">High Priority</option>
                        <option value="Medium" selected>Medium Priority</option>
                        <option value="Low">Low Priority</option>
                    </select>
                </div>
                <button 
                    type="submit" 
                    class="btn-primary px-8 py-3 rounded-xl font-medium flex items-center justify-center gap-2"
                    aria-label="Add task"
                >
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    Add Task
                </button>
            </form>
        </section>

        <!-- Search and Filtering Section -->
        <section class="glass-card rounded-2xl shadow-lg p-6 mb-6" aria-label="Search and Filtering">
            <div class="filter-bar flex flex-wrap items-center justify-between gap-4">
                <!-- Search -->
                <div class="flex-1 min-w-[200px] relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                    <label for="search-tasks" class="sr-only">Search tasks by title</label>
                    <input 
                        type="search" 
                        id="search-tasks"
                        placeholder="Search tasks by title..." 
                        class="w-full pl-10 pr-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white/80"
                        aria-label="Search tasks by title"
                    >
                </div>

                <!-- Status Filters -->
                <div class="flex gap-2" role="group" aria-label="Filter tasks by status">
                    <button class="filter-btn px-4 py-2 rounded-lg font-medium transition-all filter-active" data-filter="all">All</button>
                    <button class="filter-btn px-4 py-2 rounded-lg font-medium transition-all hover:bg-slate-200" data-filter="active">Active</button>
                    <button class="filter-btn px-4 py-2 rounded-lg font-medium transition-all hover:bg-slate-200" data-filter="completed">Completed</button>
                </div>

                <!-- Priority Filter -->
                <div>
                    <label for="filter-priority" class="sr-only">Filter tasks by priority</label>
                    <select 
                        id="filter-priority"
                        class="px-4 py-2 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-400 bg-white/80"
                        aria-label="Filter tasks by priority"
                    >
                        <option value="">All Priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <!-- View Toggle -->
                <div class="flex gap-2 border-l pl-4 border-slate-300">
                    <button id="view-list" class="p-2 rounded-lg bg-slate-200" aria-label="List view" title="List view">
                        <i data-lucide="list" class="w-5 h-5"></i>
                    </button>
                    <button id="view-kanban" class="p-2 rounded-lg hover:bg-slate-200" aria-label="Kanban view" title="Kanban view">
                        <i data-lucide="columns" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- Export/Import Section (Innovation Feature) -->
        <section class="flex justify-end gap-2 mb-4" aria-label="Data Persistence Controls">
            <button id="export-btn" class="px-4 py-2 bg-white rounded-lg shadow-sm text-sm font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i>
                Export JSON
            </button>
            <button id="import-btn" class="px-4 py-2 bg-white rounded-lg shadow-sm text-sm font-medium text-slate-700 hover:bg-slate-50 flex items-center gap-2">
                <i data-lucide="upload" class="w-4 h-4"></i>
                Import JSON
            </button>
            <input type="file" id="import-file" accept=".json" class="hidden" aria-label="Import tasks from JSON file">
        </section>

        <!-- Task List Section -->
        <section class="glass-card rounded-2xl shadow-lg p-6 view-list" id="task-container" aria-label="Task Management">
            <div id="tasks-list" class="task-grid space-y-3">
                <!-- Tasks rendered here -->
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-12">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="check-circle-2" class="w-8 h-8 text-slate-400"></i>
                </div>
                <p class="text-slate-500 text-lg">No tasks yet</p>
                <p class="text-slate-400 text-sm">Add a task to get started</p>
            </div>
        </section>

        <!-- Kanban View (Hidden by default) -->
        <section class="glass-card rounded-2xl shadow-lg p-6 view-kanban hidden" id="kanban-container" aria-label="Kanban Task Management">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="kanban-column" data-kanban="high">
                    <h3 class="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-red-500"></span>
                        High Priority
                    </h3>
                    <div class="kanban-tasks space-y-2" id="kanban-high"></div>
                </div>
                <div class="kanban-column" data-kanban="medium">
                    <h3 class="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                        Medium Priority
                    </h3>
                    <div class="kanban-tasks space-y-2" id="kanban-medium"></div>
                </div>
                <div class="kanban-column" data-kanban="low">
                    <h3 class="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                        Low Priority
                    </h3>
                    <div class="kanban-tasks space-y-2" id="kanban-low"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Task Management Application - FocusList
        // Uses Local Storage for Data Persistence
        
        const STORAGE_KEY = 'focuslist_tasks';
        
        let tasks = [];
        let currentFilter = 'all';
        let currentPriorityFilter = '';
        let currentSearch = '';
        let currentView = 'list';
        
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Load tasks from Local Storage
        function loadTasks() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    tasks = JSON.parse(stored);
                }
            } catch (e) {
                console.error('Error loading from Local Storage:', e);
                tasks = [];
            }
            renderTasks();
            updateStatistics();
        }
        
        // Save tasks to Local Storage
        function saveTasks() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            } catch (e) {
                console.error('Error saving to Local Storage:', e);
            }
            updateStatistics();
        }
        
        // Create new task
        function createTask(title, priority) {
            const task = {
                id: Date.now(),
                title: title.trim(),
                priority: priority,
                completed: false,
                createdAt: new Date().toISOString()
            };
            tasks.unshift(task);
            saveTasks();
            renderTasks();
        }
        
        // Mark task as completed or active
        function toggleTaskComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                renderTasks();
            }
        }
        
        // Edit existing task title
        function editTaskTitle(id, newTitle) {
            const task = tasks.find(t => t.id === id);
            if (task && newTitle.trim()) {
                task.title = newTitle.trim();
                saveTasks();
            }
        }
        
        // Edit task priority
        function editTaskPriority(id, newPriority) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.priority = newPriority;
                saveTasks();
                renderTasks();
            }
        }
        
        // Delete task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderTasks();
        }
        
        // Update statistics display
        function updateStatistics() {
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const pendingTasks = totalTasks - completedTasks;
            
            document.getElementById('stat-total').textContent = totalTasks;
            document.getElementById('stat-completed').textContent = completedTasks;
            document.getElementById('stat-pending').textContent = pendingTasks;
        }
        
        // Filter tasks based on current criteria
        function getFilteredTasks() {
            return tasks.filter(task => {
                // Filter by status (All, Active, Completed)
                if (currentFilter === 'active' && task.completed) return false;
                if (currentFilter === 'completed' && !task.completed) return false;
                
                // Filter by priority
                if (currentPriorityFilter && task.priority !== currentPriorityFilter) return false;
                
                // Search tasks by title
                if (currentSearch) {
                    const searchLower = currentSearch.toLowerCase();
                    if (!task.title.toLowerCase().includes(searchLower)) return false;
                }
                
                return true;
            });
        }
        
        // Render task list
        function renderTasks() {
            const filtered = getFilteredTasks();
            const container = document.getElementById('tasks-list');
            const emptyState = document.getElementById('empty-state');
            
            // Clear containers
            container.innerHTML = '';
            document.getElementById('kanban-high').innerHTML = '';
            document.getElementById('kanban-medium').innerHTML = '';
            document.getElementById('kanban-low').innerHTML = '';
            
            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }
            
            filtered.forEach(task => {
                const taskEl = createTaskElement(task);
                container.appendChild(taskEl);
                
                // Also add to kanban
                const kanbanCard = createKanbanCard(task);
                const priorityKey = task.priority.toLowerCase();
                const kanbanCol = document.getElementById(`kanban-${priorityKey}`);
                if (kanbanCol) {
                    kanbanCol.appendChild(kanbanCard);
                }
            });
            
            lucide.createIcons();
        }
        
        // Create task DOM element for list view
        function createTaskElement(task) {
            const div = document.createElement('div');
            div.className = `bg-white rounded-xl p-4 shadow-sm border border-slate-100 flex items-center gap-4 group hover:shadow-md transition-all ${
                task.completed ? 'opacity-75' : ''
            }`;
            div.dataset.taskId = task.id;
            
            const priorityClass = `priority-${task.priority.toLowerCase()}`;
            
            div.innerHTML = `
                <input 
                    type="checkbox" 
                    class="task-checkbox w-5 h-5 rounded border-slate-300 text-slate-800 focus:ring-slate-400 cursor-pointer"
                    ${task.completed ? 'checked' : ''}
                    onchange="toggleTaskComplete(${task.id})"
                    aria-label="Mark task as ${task.completed ? 'active' : 'completed'}"
                >
                <div class="flex-1 min-w-0">
                    <p 
                        class="font-medium text-slate-800 truncate ${task.completed ? 'line-through text-slate-400' : ''}"
                        contenteditable="${!task.completed}"
                        onblur="editTaskTitle(${task.id}, this.textContent)"
                        onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}"
                    >${escapeHtml(task.title)}</p>
                </div>
                <select 
                    class="text-xs font-medium px-2 py-1 rounded-lg ${priorityClass} cursor-pointer"
                    onchange="editTaskPriority(${task.id}, this.value)"
                    aria-label="Change task priority"
                >
                    <option value="High" ${task.priority === 'High' ? 'selected' : ''}>High</option>
                    <option value="Medium" ${task.priority === 'Medium' ? 'selected' : ''}>Medium</option>
                    <option value="Low" ${task.priority === 'Low' ? 'selected' : ''}>Low</option>
                </select>
                <button 
                    onclick="deleteTask(${task.id})"
                    class="opacity-0 group-hover:opacity-100 p-2 text-slate-400 hover:text-red-500 transition-all"
                    aria-label="Delete task"
                >
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            `;
            
            return div;
        }
        
        // Create kanban card
        function createKanbanCard(task) {
            const div = document.createElement('div');
            div.className = `bg-white rounded-lg p-3 shadow-sm border border-slate-200 cursor-pointer hover:shadow-md transition-all ${
                task.completed ? 'opacity-60' : ''
            }`;
            
            div.innerHTML = `
                <div class="flex items-start gap-2 mb-2">
                    <input 
                        type="checkbox" 
                        class="mt-1 w-4 h-4 rounded"
                        ${task.completed ? 'checked' : ''}
                        onchange="toggleTaskComplete(${task.id})"
                    >
                    <p class="text-sm font-medium text-slate-800 ${task.completed ? 'line-through' : ''}">${escapeHtml(task.title)}</p>
                </div>
                <div class="flex justify-end">
                    <button onclick="deleteTask(${task.id})" class="text-xs text-slate-400 hover:text-red-500">
                        <i data-lucide="trash-2" class="w-3 h-3"></i>
                    </button>
                </div>
            `;
            
            return div;
        }
        
        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Export tasks to JSON
        function exportTasks() {
            const dataStr = JSON.stringify(tasks, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `focuslist-tasks-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
        
        // Import tasks from JSON
        function importTasks(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        tasks = imported;
                        saveTasks();
                        renderTasks();
                        alert(`Imported ${tasks.length} tasks successfully`);
                    } else {
                        alert('Invalid JSON format');
                    }
                } catch (err) {
                    alert('Error reading file');
                }
            };
            reader.readAsText(file);
        }
        
        // Event Listeners
        
        // Task creation form
        document.getElementById('task-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('task-title');
            const priorityInput = document.getElementById('task-priority');
            
            if (titleInput.value.trim()) {
                createTask(titleInput.value, priorityInput.value);
                titleInput.value = '';
                titleInput.focus();
            }
        });
        
        // Search tasks by title
        document.getElementById('search-tasks').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderTasks();
        });
        
        // Filter tasks by status (All, Active, Completed)
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('filter-active');
                    b.classList.add('hover:bg-slate-200');
                });
                btn.classList.add('filter-active');
                btn.classList.remove('hover:bg-slate-200');
                
                currentFilter = btn.dataset.filter;
                renderTasks();
            });
        });
        
        // Filter tasks by priority
        document.getElementById('filter-priority').addEventListener('change', (e) => {
            currentPriorityFilter = e.target.value;
            renderTasks();
        });
        
        // View toggle
        document.getElementById('view-list').addEventListener('click', () => {
            currentView = 'list';
            document.getElementById('task-container').classList.remove('hidden');
            document.getElementById('kanban-container').classList.add('hidden');
            document.getElementById('view-list').classList.add('bg-slate-200');
            document.getElementById('view-kanban').classList.remove('bg-slate-200');
        });
        
        document.getElementById('view-kanban').addEventListener('click', () => {
            currentView = 'kanban';
            document.getElementById('task-container').classList.add('hidden');
            document.getElementById('kanban-container').classList.remove('hidden');
            document.getElementById('view-list').classList.remove('bg-slate-200');
            document.getElementById('view-kanban').classList.add('bg-slate-200');
            renderTasks();
        });
        
        // Export/Import
        document.getElementById('export-btn').addEventListener('click', exportTasks);
        document.getElementById('import-btn').addEventListener('click', () => {
            document.getElementById('import-file').click();
        });
        document.getElementById('import-file').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                importTasks(e.target.files[0]);
                e.target.value = '';
            }
        });
        
        // Initialize
        document.addEventListener('DOMContentLoaded', loadTasks);
    </script>
</body>
</html>
