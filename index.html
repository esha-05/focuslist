<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="FocusList — a calm, ink-and-paper daily task list." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%233A5A40%22/><path d=%22M25 52 L44 71 L76 30%22 stroke=%22%23F4F1E8%22 stroke-width=%2210%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
<title>FocusList — a calm daily list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F1E8;
    --paper-raised: #FCFAF3;
    --ink: #22261E;
    --ink-soft: #5B6157;
    --line: #D9D4C2;
    --line-strong: #C7C1AC;
    --accent: #3A5A40;
    --accent-tint: #E2E9DD;
    --high: #8B3A3A;
    --medium: #A9782F;
    --low: #3A5A40;
    --danger: #8B3A3A;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }

  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }

  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .page {
    width: min(760px, calc(100% - 40px));
    margin: 0 auto;
    padding: 56px 0 80px;
  }

  /* ---------- Masthead ---------- */
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .01em;
    color: var(--accent);
    margin-bottom: 22px;
  }
  .wordmark .mark {
    width: 18px; height: 18px; border-radius: 5px;
    background: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .wordmark .mark svg { width: 11px; height: 11px; }

  h1.headline {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(32px, 5vw, 46px);
    line-height: 1.12;
    letter-spacing: -.01em;
    margin: 0 0 10px;
    max-width: 14ch;
  }

  .dek {
    font-size: 15.5px;
    color: var(--ink-soft);
    margin: 0 0 28px;
    max-width: 48ch;
    line-height: 1.5;
  }

  .ledger {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0;
    padding: 16px 0;
    border-top: 1px solid var(--line-strong);
    border-bottom: 1px solid var(--line-strong);
    margin-bottom: 34px;
    font-size: 13.5px;
  }
  .ledger-item {
    padding: 0 16px;
    border-left: 1px solid var(--line);
    color: var(--ink-soft);
  }
  .ledger-item:first-child { padding-left: 0; border-left: 0; }
  .ledger-item strong { color: var(--ink); font-weight: 600; }
  .ledger-track {
    flex: 1 1 140px;
    min-width: 120px;
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin: 0 16px;
  }
  .ledger-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .3s ease;
  }
  .priority-tally {
    display: flex;
    gap: 12px;
    padding-left: 16px;
    border-left: 1px solid var(--line);
  }
  .priority-tally span { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.high { background: var(--high); }
  .dot.medium { background: var(--medium); }
  .dot.low { background: var(--low); }

  @media (max-width: 560px) {
    .ledger { flex-direction: column; align-items: stretch; gap: 10px; }
    .ledger-item, .priority-tally { border-left: 0; padding: 0; }
    .ledger-track { margin: 4px 0; }
  }

  /* ---------- Composer ---------- */
  .composer {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin-bottom: 22px;
  }
  .field {
    flex: 1;
    border: none;
    border-bottom: 1.5px solid var(--line-strong);
    background: transparent;
    padding: 10px 2px;
    font-size: 16px;
    color: var(--ink);
  }
  .field::placeholder { color: #9CA091; }
  .field:focus { border-color: var(--accent); }

  select.field {
    flex: 0 0 130px;
    -webkit-appearance: none;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 8px) center, calc(100% - 3px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 20px;
  }

  .btn-add {
    flex: 0 0 auto;
    border: none;
    background: var(--ink);
    color: var(--paper-raised);
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14.5px;
  }
  .btn-add:hover { background: var(--accent); }

  @media (max-width: 560px) {
    .composer { flex-wrap: wrap; }
    .field { flex: 1 1 100%; }
    select.field { flex: 1 1 auto; }
    .btn-add { flex: 1 1 auto; padding: 12px; }
  }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    padding-bottom: 14px;
    margin-bottom: 6px;
  }
  .search-field {
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: transparent;
    padding: 6px 2px;
    font-size: 14px;
    min-width: 160px;
    color: var(--ink);
  }
  .search-field::placeholder { color: #9CA091; }
  .search-field:focus { border-color: var(--accent); }

  .tabs { display: flex; gap: 18px; }
  .tab {
    border: none;
    background: none;
    padding: 4px 0;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--ink); border-color: var(--accent); font-weight: 600; }
  .tab:hover { color: var(--ink); }

  select.priority-filter {
    border: none;
    background: none;
    font-size: 13.5px;
    color: var(--ink-soft);
    -webkit-appearance: none;
    appearance: none;
    padding-right: 16px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 4px) center, calc(100% + 1px) center;
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }

  .row-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0 4px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .link-btn {
    border: none;
    background: none;
    color: var(--ink-soft);
    font-size: 12.5px;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 4px 0;
  }
  .link-btn:hover { color: var(--accent); }
  .row-actions .links { display: flex; gap: 16px; }

  /* ---------- Task list ---------- */
  .task-list { list-style: none; margin: 0; padding: 0; }
  .task {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
  }
  .task:last-child { border-bottom: 0; }

  .check {
    width: 21px; height: 21px;
    border-radius: 5px;
    border: 1.5px solid var(--line-strong);
    background: var(--paper-raised);
    display: grid; place-items: center;
    flex: 0 0 auto;
    color: var(--paper-raised);
  }
  .check svg { width: 12px; height: 12px; opacity: 0; }
  .task.completed .check { background: var(--accent); border-color: var(--accent); }
  .task.completed .check svg { opacity: 1; }

  .task-title {
    margin: 0 0 6px;
    font-size: 15.5px;
    overflow-wrap: anywhere;
  }
  .task.completed .task-title { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line-strong); }

  .priority-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .task-actions { display: flex; gap: 4px; }
  .icon-btn {
    border: none; background: none; color: var(--ink-soft);
    width: 30px; height: 30px; border-radius: 6px;
    display: grid; place-items: center; font-size: 14px;
  }
  .icon-btn:hover { background: var(--accent-tint); color: var(--accent); }
  .icon-btn.delete:hover { background: #F3E4E1; color: var(--danger); }

  .edit-input {
    border: none;
    border-bottom: 1.5px solid var(--accent);
    background: transparent;
    padding: 4px 2px;
    font-size: 15.5px;
    width: 100%;
  }

  @media (max-width: 560px) {
    .task { grid-template-columns: auto 1fr; }
    .task-actions { grid-column: 2; justify-content: flex-start; margin-top: 4px; }
  }

  /* ---------- Empty state ---------- */
  .empty { text-align: left; padding: 40px 0; color: var(--ink-soft); }
  .empty h2 { font-family: var(--serif); font-weight: 500; font-size: 20px; color: var(--ink); margin: 0 0 6px; }
  .empty p { margin: 0; font-size: 14px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px);
    background: var(--ink); color: var(--paper-raised); padding: 10px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none;
    transition: all .2s ease; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Confirm dialog ---------- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(34,38,30,.35);
    display: none; align-items: center; justify-content: center; z-index: 30;
    padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--paper-raised);
    border: 1px solid var(--line-strong);
    border-radius: 12px; padding: 24px;
    width: min(340px, 100%);
  }
  .modal h3 { font-family: var(--serif); font-weight: 500; margin: 0 0 8px; font-size: 18px; }
  .modal p { margin: 0 0 18px; color: var(--ink-soft); font-size: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn-plain {
    border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
    padding: 8px 14px; border-radius: 7px; font-size: 13.5px; font-weight: 500;
  }
  .btn-plain:hover { background: var(--accent-tint); }
  .btn-danger {
    border: none; background: var(--danger); color: var(--paper-raised);
    padding: 8px 14px; border-radius: 7px; font-size: 13.5px; font-weight: 600;
  }
  .btn-danger:hover { opacity: .88; }
</style>
</head>
<body>
  <main class="page">
    <div class="wordmark">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      FocusList
    </div>

    <h1 class="headline" id="greeting">Plan the day, then get out of your head.</h1>
    <p class="dek" id="today"></p>

    <section class="ledger" aria-label="Task overview">
      <span class="ledger-item"><strong id="totalCount">0</strong> total</span>
      <span class="ledger-item"><strong id="completedCount">0</strong> done</span>
      <span class="ledger-item"><strong id="pendingCount">0</strong> open</span>
      <div class="ledger-track"><div class="ledger-fill" id="progressFill"></div></div>
      <span class="ledger-item" id="progressLabel">0%</span>
      <div class="priority-tally" id="priorityBreakdown"></div>
    </section>

    <form class="composer" id="addForm">
      <label class="sr-only" for="taskInput">Task title</label>
      <input class="field" id="taskInput" maxlength="140" autocomplete="off" placeholder="What needs doing today?" required />
      <label class="sr-only" for="priorityInput">Priority</label>
      <select class="field" id="priorityInput" aria-label="Task priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
      <button class="btn-add" type="submit">Add task</button>
    </form>

    <div class="toolbar" aria-label="Task controls">
      <label class="sr-only" for="searchInput">Search tasks</label>
      <input class="search-field" id="searchInput" placeholder="Search…" autocomplete="off" />
      <div class="tabs" role="tablist" aria-label="Task status">
        <button class="tab active" id="tab-all" data-status="all" role="tab" aria-selected="true" aria-controls="taskList">All</button>
        <button class="tab" id="tab-active" data-status="active" role="tab" aria-selected="false" aria-controls="taskList" tabindex="-1">Active</button>
        <button class="tab" id="tab-completed" data-status="completed" role="tab" aria-selected="false" aria-controls="taskList" tabindex="-1">Completed</button>
      </div>
      <label class="sr-only" for="priorityFilter">Filter by priority</label>
      <select class="priority-filter" id="priorityFilter" aria-label="Filter by priority">
        <option value="all">Any priority</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </div>

    <div class="row-actions">
      <span id="resultsHint"></span>
      <span class="links">
        <button class="link-btn" id="resetFiltersBtn" type="button">Reset filters</button>
        <button class="link-btn" id="clearCompletedBtn" type="button">Clear completed</button>
      </span>
    </div>

    <ul class="task-list" id="taskList" role="tabpanel" aria-live="polite"></ul>
    <div class="empty" id="emptyState" hidden>
      <h2 id="emptyTitle">Nothing on the list yet</h2>
      <p id="emptyText">Add a task above to start your day.</p>
    </div>
  </main>

  <div class="modal-backdrop" id="confirmBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h3 id="confirmTitle">Delete this task?</h3>
      <p>This can't be undone.</p>
      <div class="modal-actions">
        <button class="btn-plain" id="confirmCancel" type="button">Cancel</button>
        <button class="btn-danger" id="confirmDelete" type="button">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const STORAGE_KEY = "focuslist.tasks.v1";
    let tasks = loadTasks();
    let statusFilter = "all";
    let searchTerm = "";
    let priorityFilter = "all";
    let editingId = null;
    let pendingDeleteId = null;

    const els = {
      addForm: document.getElementById("addForm"),
      taskInput: document.getElementById("taskInput"),
      priorityInput: document.getElementById("priorityInput"),
      searchInput: document.getElementById("searchInput"),
      priorityFilter: document.getElementById("priorityFilter"),
      taskList: document.getElementById("taskList"),
      emptyState: document.getElementById("emptyState"),
      emptyTitle: document.getElementById("emptyTitle"),
      emptyText: document.getElementById("emptyText"),
      total: document.getElementById("totalCount"),
      completed: document.getElementById("completedCount"),
      pending: document.getElementById("pendingCount"),
      today: document.getElementById("today"),
      toast: document.getElementById("toast"),
      progressFill: document.getElementById("progressFill"),
      progressLabel: document.getElementById("progressLabel"),
      priorityBreakdown: document.getElementById("priorityBreakdown"),
      resultsHint: document.getElementById("resultsHint"),
      resetFiltersBtn: document.getElementById("resetFiltersBtn"),
      clearCompletedBtn: document.getElementById("clearCompletedBtn"),
      confirmBackdrop: document.getElementById("confirmBackdrop"),
      confirmCancel: document.getElementById("confirmCancel"),
      confirmDelete: document.getElementById("confirmDelete")
    };

    els.today.textContent = new Intl.DateTimeFormat("en-IN", {
      weekday: "long", day: "numeric", month: "long"
    }).format(new Date());

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (err) {
        showToast("Couldn't save — storage may be full");
        console.error("saveTasks failed:", err);
      }
    }

    function createTask(title, priority) {
      return {
        id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
        title: title.trim(),
        priority,
        completed: false,
        createdAt: Date.now()
      };
    }

    function filteredTasks() {
      const query = searchTerm.trim().toLowerCase();
      return tasks.filter(task => {
        const matchesStatus =
          statusFilter === "all" ||
          (statusFilter === "active" && !task.completed) ||
          (statusFilter === "completed" && task.completed);
        const matchesPriority = priorityFilter === "all" || task.priority === priorityFilter;
        const matchesSearch = !query || task.title.toLowerCase().includes(query);
        return matchesStatus && matchesPriority && matchesSearch;
      });
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, ch => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
      }[ch]));
    }

    function priorityLabel(priority) {
      return priority.charAt(0).toUpperCase() + priority.slice(1);
    }

    function renderProgress() {
      const total = tasks.length;
      const done = tasks.filter(t => t.completed).length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      els.progressFill.style.width = pct + "%";
      els.progressLabel.textContent = pct + "%";

      const counts = { high: 0, medium: 0, low: 0 };
      tasks.forEach(t => { if (!t.completed) counts[t.priority]++; });
      els.priorityBreakdown.innerHTML = `
        <span><span class="dot high"></span>${counts.high} high</span>
        <span><span class="dot medium"></span>${counts.medium} medium</span>
        <span><span class="dot low"></span>${counts.low} low</span>
      `;
    }

    function render() {
      const visible = filteredTasks();

      els.total.textContent = tasks.length;
      els.completed.textContent = tasks.filter(t => t.completed).length;
      els.pending.textContent = tasks.filter(t => !t.completed).length;
      els.resultsHint.textContent = tasks.length
        ? `Showing ${visible.length} of ${tasks.length}`
        : "";

      els.taskList.innerHTML = visible.map(task => {
        if (editingId === task.id) {
          return `
            <li class="task" data-id="${task.id}">
              <button class="check" data-action="toggle" aria-pressed="${task.completed}" aria-label="Mark task ${task.completed ? "active" : "completed"}">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div>
                <label class="sr-only" for="edit-${task.id}">Edit task title</label>
                <input class="edit-input" id="edit-${task.id}" data-edit-input value="${escapeHtml(task.title)}" maxlength="140" />
              </div>
              <div class="task-actions">
                <button class="icon-btn" data-action="save" aria-label="Save task">✓</button>
                <button class="icon-btn" data-action="cancel" aria-label="Cancel edit">×</button>
              </div>
            </li>`;
        }

        return `
          <li class="task ${task.completed ? "completed" : ""}" data-id="${task.id}">
            <button class="check" data-action="toggle" aria-pressed="${task.completed}" aria-label="${task.completed ? "Mark as active" : "Mark as completed"}">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div>
              <p class="task-title">${escapeHtml(task.title)}</p>
              <span class="priority-tag"><span class="dot ${task.priority}"></span>${priorityLabel(task.priority)}</span>
            </div>
            <div class="task-actions">
              <button class="icon-btn" data-action="edit" aria-label="Edit task">✎</button>
              <button class="icon-btn delete" data-action="delete" aria-label="Delete task">⌫</button>
            </div>
          </li>`;
      }).join("");

      const noTasksAtAll = tasks.length === 0;
      els.emptyState.hidden = visible.length !== 0;
      els.emptyTitle.textContent = noTasksAtAll ? "Nothing on the list yet" : "No matching tasks";
      els.emptyText.textContent = noTasksAtAll
        ? "Add a task above to start your day."
        : "Try changing your search or filters.";

      if (editingId) {
        const input = document.querySelector("[data-edit-input]");
        if (input) {
          input.focus();
          input.select();
        }
      }

      renderProgress();
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => els.toast.classList.remove("show"), 1800);
    }

    function debounce(fn, delay) {
      let timer;
      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    els.addForm.addEventListener("submit", event => {
      event.preventDefault();
      const title = els.taskInput.value.trim();
      if (!title) return;
      tasks.unshift(createTask(title, els.priorityInput.value));
      saveTasks();
      els.taskInput.value = "";
      els.priorityInput.value = "medium";
      render();
      showToast("Task added");
      els.taskInput.focus();
    });

    const handleSearch = debounce(value => {
      searchTerm = value;
      render();
    }, 150);
    els.searchInput.addEventListener("input", event => handleSearch(event.target.value));

    els.priorityFilter.addEventListener("change", event => {
      priorityFilter = event.target.value;
      render();
    });

    const tabButtons = Array.from(document.querySelectorAll(".tab"));
    function activateTab(tab) {
      statusFilter = tab.dataset.status;
      tabButtons.forEach(t => {
        const active = t === tab;
        t.classList.toggle("active", active);
        t.setAttribute("aria-selected", active);
        t.tabIndex = active ? 0 : -1;
      });
      tab.focus();
      render();
    }
    tabButtons.forEach((tab, index) => {
      tab.addEventListener("click", () => activateTab(tab));
      tab.addEventListener("keydown", event => {
        if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
          event.preventDefault();
          const dir = event.key === "ArrowRight" ? 1 : -1;
          const nextIndex = (index + dir + tabButtons.length) % tabButtons.length;
          activateTab(tabButtons[nextIndex]);
        }
      });
    });

    els.resetFiltersBtn.addEventListener("click", () => {
      searchTerm = "";
      priorityFilter = "all";
      els.searchInput.value = "";
      els.priorityFilter.value = "all";
      activateTab(document.getElementById("tab-all"));
      showToast("Filters reset");
    });

    els.clearCompletedBtn.addEventListener("click", () => {
      const before = tasks.length;
      tasks = tasks.filter(t => !t.completed);
      if (tasks.length === before) {
        showToast("No completed tasks to clear");
        return;
      }
      saveTasks();
      render();
      showToast("Completed tasks cleared");
    });

    function openConfirm(id) {
      pendingDeleteId = id;
      els.confirmBackdrop.classList.add("show");
      els.confirmDelete.focus();
    }
    function closeConfirm() {
      pendingDeleteId = null;
      els.confirmBackdrop.classList.remove("show");
    }
    els.confirmCancel.addEventListener("click", closeConfirm);
    els.confirmBackdrop.addEventListener("click", event => {
      if (event.target === els.confirmBackdrop) closeConfirm();
    });
    els.confirmDelete.addEventListener("click", () => {
      if (!pendingDeleteId) return;
      tasks = tasks.filter(t => t.id !== pendingDeleteId);
      if (editingId === pendingDeleteId) editingId = null;
      saveTasks();
      render();
      showToast("Task deleted");
      closeConfirm();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && els.confirmBackdrop.classList.contains("show")) closeConfirm();
    });

    els.taskList.addEventListener("click", event => {
      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;
      const item = actionButton.closest(".task");
      const id = item.dataset.id;
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const action = actionButton.dataset.action;
      if (action === "toggle") {
        task.completed = !task.completed;
        saveTasks();
        render();
        showToast(task.completed ? "Task completed" : "Task reopened");
      } else if (action === "edit") {
        editingId = id;
        render();
      } else if (action === "cancel") {
        editingId = null;
        render();
      } else if (action === "save") {
        const input = item.querySelector("[data-edit-input]");
        const title = input.value.trim();
        if (!title) {
          showToast("Task title cannot be empty");
          input.focus();
          return;
        }
        task.title = title;
        editingId = null;
        saveTasks();
        render();
        showToast("Task updated");
      } else if (action === "delete") {
        openConfirm(id);
      }
    });

    els.taskList.addEventListener("keydown", event => {
      if (event.key !== "Enter") return;
      const input = event.target.closest("[data-edit-input]");
      if (!input) return;
      input.closest(".task").querySelector('[data-action="save"]').click();
    });

    render();
  </script>
</body>
</html>
